<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Leave Request Details</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('leave')}"></aside>
    <main class="main">
        <header class="topbar"><div class="page-title"><h1 th:text="${leaveRequest.employeeName}">Employee</h1><span class="muted" th:text="${leaveRequest.leaveType}">Annual</span></div><div class="actions"><a class="btn btn-secondary" th:href="@{/leave-requests}">List</a><a class="btn btn-primary" th:if="${canManageLeaveRequest}" th:href="@{/leave-requests/edit/{id}(id=${leaveRequest.id})}">Edit</a></div></header>
        <section class="card detail-list">
            <div class="detail-item"><span class="detail-label">Employee ID</span><span class="detail-value" th:text="${leaveRequest.employeeId}">NV001</span></div>
            <div class="detail-item"><span class="detail-label">Employee Name</span><span class="detail-value" th:text="${leaveRequest.employeeName}">Alex Morgan</span></div>
            <div class="detail-item"><span class="detail-label">Leave Type</span><span class="detail-value" th:text="${leaveRequest.leaveType}">ANNUAL</span></div>
            <div class="detail-item"><span class="detail-label">Start Date</span><span class="detail-value" th:text="${leaveRequest.startDate}">2026-08-12</span></div>
            <div class="detail-item"><span class="detail-label">End Date</span><span class="detail-value" th:text="${leaveRequest.endDate}">2026-08-13</span></div>
            <div class="detail-item"><span class="detail-label">Approver</span><span class="detail-value" th:text="${leaveRequest.approvedBy}">HR</span></div>
            <div class="detail-item"><span class="detail-label">Created Date</span><span class="detail-value" th:text="${leaveRequest.createdAt}">2026-08-12</span></div>
            <div class="detail-item"><span class="detail-label">Status</span><span class="badge" th:text="${leaveRequest.status}">PENDING</span></div>
            <div class="detail-item"><span class="detail-label">Reason</span><span class="detail-value" th:text="${leaveRequest.reason}">Reason</span></div>
        </section>
    </main>
</div>
</body>
</html>
