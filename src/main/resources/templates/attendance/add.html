<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Check In</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('attendance')}"></aside><main class="main">
<header class="topbar"><div class="page-title"><h1>Check In</h1><span class="muted" th:text="${attendance.date}"></span></div><a class="btn btn-secondary" th:href="@{/attendance}">Back</a></header>
<div class="alert alert-error" th:if="${attendanceError}" th:text="${attendanceError}"></div>
<form class="card form-grid" th:action="@{/attendance/add}" method="post"><input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="form-field"><label>Staff Member</label><input class="form-control" th:value="${attendance.employeeName}" readonly></div>
<div class="form-field"><label>Department</label><input class="form-control" th:value="${attendance.department}" readonly></div>
<div class="form-field full page-actions"><button class="btn btn-primary" type="submit">Check In</button><a class="btn btn-secondary" th:href="@{/attendance}">Cancel</a></div></form>
</main></div></body></html>
