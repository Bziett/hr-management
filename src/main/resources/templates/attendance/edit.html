<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Correct Attendance</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('attendance')}"></aside><main class="main">
<header class="topbar"><div class="page-title"><h1>Correct Attendance</h1><span th:text="${attendance.employeeName + ' / ' + attendance.date}"></span></div><a class="btn btn-secondary" th:href="@{/attendance/{id}(id=${attendance.id})}">Back</a></header>
<form class="card form-grid" th:action="@{/attendance/edit/{id}(id=${attendance.id})}" method="post"><input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="form-field"><label for="checkIn">Check In</label><input id="checkIn" class="form-control" name="checkIn" type="time" step="1" th:value="${attendance.checkIn}" required></div>
<div class="form-field"><label for="checkOut">Check Out</label><input id="checkOut" class="form-control" name="checkOut" type="time" step="1" th:value="${attendance.checkOut}"></div>
<div class="form-field full"><label for="correctionReason">Correction Reason</label><textarea id="correctionReason" name="correctionReason" maxlength="1000" required></textarea></div>
<div class="form-field full page-actions"><button class="btn btn-primary" type="submit">Save Correction</button></div></form></main></div></body></html>
