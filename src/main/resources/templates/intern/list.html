<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interns - HR Management</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('interns')}"></aside>
    <main class="main">
        <header class="topbar">
            <div class="page-title"><h1>Intern List</h1><span class="muted">Track internships, mentors, and departments</span></div>
            <a class="btn btn-primary" th:if="${currentRole == 'ADMIN' or currentRole == 'HR'}" th:href="@{/interns/add}">Add Intern</a>
        </header>
        <section class="card">
            <div class="toolbar">
                <input class="search-input" data-table-search="#internsTable" placeholder="Search by code, name, university, department, mentor">
                <form class="actions filter-form" th:if="${currentRole == 'ADMIN' or currentRole == 'HR'}" th:action="@{/interns}" method="get">
                    <select class="form-select" name="department">
                        <option value="">All Departments</option>
                        <option th:each="department : ${departments}" th:value="${department}" th:text="${department}" th:selected="${department == selectedDepartment}">Engineering</option>
                    </select>
                    <button class="btn btn-secondary" type="submit">Filter</button>
                </form>
            </div>
            <div class="table-wrap">
                <table id="internsTable">
                    <thead><tr><th>Intern Code</th><th>Full Name</th><th>University</th><th>Major</th><th>Department</th><th>Mentor</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody>
                    <tr th:each="intern : ${interns}">
                        <td th:text="${intern.internCode}">INT001</td>
                        <td th:text="${intern.fullName}">Taylor Reed</td>
                        <td th:text="${intern.university}">University</td>
                        <td th:text="${intern.major}">Software</td>
                        <td th:text="${intern.department}">Engineering</td>
                        <td th:text="${intern.mentor}">Mentor</td>
                        <td><span class="badge" th:text="${intern.status}">ACTIVE</span></td>
                        <td>
                            <div class="actions">
                                <a class="btn btn-ghost" th:href="@{/interns/{id}(id=${intern.id})}">View</a>
                                <a class="btn btn-secondary" th:if="${currentRole == 'ADMIN' or currentRole == 'HR' or currentRole == 'MANAGER'}" th:href="@{/interns/edit/{id}(id=${intern.id})}">Edit</a>
                                <form class="inline-form" th:if="${currentRole == 'ADMIN' or currentRole == 'HR'}" th:action="@{/interns/delete/{id}(id=${intern.id})}" method="post" onsubmit="return confirm('Delete this intern?')">
                                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button class="btn btn-danger" type="submit">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(interns)}"><td colspan="8" class="empty-state">No interns found</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
